<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Surface tone per mode, from the generated M3 scheme, so the browser
         chrome matches the app instead of being wrong in one of the two. -->
    <meta name="theme-color" content="#f9f9ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Edge-to-edge on iOS. Without black-translucent, an installed web app
         is laid out *between* the status bar and the home indicator: the
         viewport-fit=cover above is ignored, every env(safe-area-inset-*)
         resolves to 0px, and iOS fills the home-indicator strip with the body
         background — a 34pt gap under the navigation bar. Translucent hands
         the whole screen to the page, so the insets become real and the
         bar's own padding covers that strip. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AssisList" />
    <meta name="description" content="Self-hosted productivity: capture tasks from WhatsApp or your AI agent, manage them in a mobile-first web app." />
    <title>AssisList</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
