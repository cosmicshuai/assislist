# AssisList — one-command self-hosted deployment
#   cp .env.example .env
#   # generate both secrets:  openssl rand -hex 32
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assislist}
      # Required, like the API token. A default password here would be the
      # path of least resistance, and it ends up in `docker compose config`,
      # the container environment, and process listings.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-assislist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assislist} -d ${POSTGRES_DB:-assislist}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: ghcr.io/cosmicshuai/assislist:${ASSISLIST_VERSION:-latest}
    ports:
      # BIND_ADDR defaults to every interface, which is the right default for a
      # box whose only job is this app. Set it to one address when something
      # else already listens on this port on another interface -- a tailscaled
      # or WireGuard proxy holding <vpn-ip>:3456 makes a 0.0.0.0 bind fail with
      # "address already in use", and narrowing the bind is the fix.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-3456}:3456"
    environment:
      # Discrete connection parameters rather than a composed DATABASE_URL, so
      # a password containing @ : / ? # works instead of producing a malformed
      # URL — which is exactly the failure that pushes people to weak passwords.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-assislist}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      PGDATABASE: ${POSTGRES_DB:-assislist}
      TODO_API_TOKEN: ${TODO_API_TOKEN:?set TODO_API_TOKEN in .env (openssl rand -hex 32)}
      TODO_AGENT_TOKEN: ${TODO_AGENT_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PORT: "3456"
      HOST: "0.0.0.0"
      AUTO_MIGRATE: "true"
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Every remaining knob the README documents. Without these lines the
      # variable sits in .env, compose never forwards it, and the setting
      # silently does nothing — the worst failure mode for a security control.
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      LOGIN_ATTEMPTS_PER_15MIN: ${LOGIN_ATTEMPTS_PER_15MIN:-10}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /ready, not /health: readiness checks the database, so a broken or
      # unmigrated instance is reported unhealthy instead of quietly 500ing.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3456/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
