name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-test:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the exact floor from package.json engines, not the '22' alias:
        # the server imports db/schema.ts directly, and unflagged TypeScript
        # stripping only landed in 22.18. '22' resolves to the newest 22.x, so
        # it would silently pass on a runtime older users do not have.
        node: ['22.18', '24']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assislist
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: assislist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assislist -d assislist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://assislist:ci-only-throwaway-password@localhost:5432/assislist_test
      TODO_API_TOKEN: ci-test-user-token-0123456789abcdef
      TODO_AGENT_TOKEN: ci-test-agent-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Migrate
        working-directory: server
        run: npm run migrate
      - name: Test
        working-directory: server
        run: npm test

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t assislist:ci .
