name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assislist
          POSTGRES_PASSWORD: assislist
          POSTGRES_DB: assislist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assislist -d assislist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://assislist:assislist@localhost:5432/assislist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Migrate
        working-directory: server
        run: npm run migrate
      - name: Test
        working-directory: server
        run: npm test

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t assislist:ci .
